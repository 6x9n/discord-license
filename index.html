<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Account Manager</title>
    <style>
        :root {
            --bg-primary: #121316;
            --bg-secondary: #18191c;
            --bg-tertiary: #1e1f22;
            --bg-card: #2b2d31;
            --text-normal: #dbdee1;
            --text-muted: #949ba4;
            --accent: #5865f2;
            --accent-hover: #4752c4;
            --danger: #da373c;
            --danger-hover: #a12828;
            --success: #23a55a;
            --border: #3f4147;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'gg sans', 'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-normal);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 950px;
            background-color: var(--bg-secondary);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        .hidden {
            display: none !important;
        }

        h2, h3 {
            margin-bottom: 16px;
            color: #fff;
        }

        /* Form Inputs & Controls */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input[type="text"], input[type="password"], select {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-normal);
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: var(--accent);
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            background-color: var(--accent);
            color: white;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            font-size: 14px;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button.danger {
            background-color: var(--danger);
        }

        button.danger:hover {
            background-color: var(--danger-hover);
        }

        .toggle-btn {
            position: absolute;
            right: 12px;
            background: none;
            color: var(--text-muted);
            padding: 0;
            font-size: 13px;
        }

        .toggle-btn:hover {
            background: none;
            color: var(--text-normal);
        }

        /* Dashboard Header Profile Card */
        .dashboard-header {
            background-color: var(--bg-card);
            border-radius: 8px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .user-info-wrapper {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background-color: var(--border);
            object-fit: cover;
        }

        .user-details h3 {
            margin-bottom: 4px;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .user-details p {
            color: var(--text-muted);
            font-size: 13px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon-btn {
            background-color: var(--bg-tertiary);
            color: var(--text-normal);
            padding: 8px 12px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .icon-btn:hover {
            background-color: var(--border);
        }

        /* Grid Stats Cards */
        .grid-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background-color: var(--bg-card);
            padding: 18px;
            border-radius: 8px;
            position: relative;
        }

        .stat-card .stat-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .stat-card .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 4px;
        }

        .stat-card .stat-sub {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Operations Section */
        .operations-section {
            background-color: var(--bg-card);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .operations-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .operations-header h3 {
            margin-bottom: 0;
            font-size: 16px;
        }

        .operations-header span {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .operations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 12px;
        }

        .op-btn {
            background-color: var(--bg-tertiary);
            color: var(--text-normal);
            padding: 14px 16px;
            border-radius: 6px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .op-btn:hover {
            background-color: var(--border);
            border-color: var(--text-muted);
        }

        .op-btn.danger-action {
            border-color: rgba(218, 55, 60, 0.4);
            color: #f23f43;
        }

        .op-btn.danger-action:hover {
            background-color: rgba(218, 55, 60, 0.15);
            border-color: var(--danger);
        }

        /* Sub-views style */
        .sub-view {
            background-color: var(--bg-card);
            border-radius: 8px;
            padding: 24px;
            margin-top: 20px;
        }

        .back-nav-bar {
            margin-bottom: 16px;
        }

        /* Terminal Logs */
        .terminal-log {
            background-color: #0b0c0e;
            color: #23a55a;
            font-family: monospace;
            padding: 16px;
            border-radius: 6px;
            height: 220px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-size: 13px;
            border: 1px solid var(--border);
            margin-top: 12px;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background-color: var(--bg-tertiary);
            border-radius: 4px;
            overflow: hidden;
            margin: 12px 0;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--success);
            transition: width 0.3s ease;
        }

        /* Houses grid */
        .house-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .house-card {
            background-color: var(--bg-tertiary);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            border: 2px solid var(--border);
            transition: all 0.2s;
        }

        .house-card:hover {
            border-color: var(--text-muted);
        }

        .house-card.selected {
            border-color: var(--accent);
            background-color: rgba(88, 101, 242, 0.1);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Login Section -->
    <section id="loginSection">
        <h2>Discord Account Login</h2>
        <div class="form-group">
            <label for="tokenInput">Account Token</label>
            <div class="input-wrapper">
                <input type="password" id="tokenInput" placeholder="Enter Discord User Token">
                <button type="button" class="toggle-btn" id="toggleTokenVisibility">Show</button>
            </div>
        </div>
        <button id="loginBtn" style="width: 100%;">Authenticate Account</button>
        
        <div class="form-group" style="margin-top: 20px;">
            <label for="savedAccounts">Saved Accounts</label>
            <select id="savedAccounts">
                <option value="">Select a saved account...</option>
            </select>
        </div>
    </section>

    <!-- Main App Content -->
    <div id="appContent" class="hidden">
        
        <!-- Header Profile Bar -->
        <div class="dashboard-header">
            <div class="user-info-wrapper">
                <img id="userAvatar" class="avatar" src="" alt="Avatar">
                <div class="user-details">
                    <h3 id="usernameDisplay">username</h3>
                    <p id="userIdDisplay">ID: -</p>
                </div>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="securityCheckBtn">🛡️</button>
                <button class="icon-btn danger" id="logoutBtn">Logout</button>
            </div>
        </div>

        <!-- Stat Cards Grid -->
        <div class="grid-stats">
            <div class="stat-card">
                <div class="stat-title">Owned Servers</div>
                <div id="statOwnedGuilds" class="stat-value">0</div>
                <div class="stat-sub">you own these</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Joined Servers</div>
                <div id="statJoinedGuilds" class="stat-value">0</div>
                <div class="stat-sub">community member</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Friends</div>
                <div id="statFriends" class="stat-value">0</div>
                <div class="stat-sub">mutual buddies</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Private DMs</div>
                <div id="statDms" class="stat-value">0</div>
                <div class="stat-sub">direct channels</div>
            </div>
        </div>

        <!-- Operations Interactive Panel -->
        <div class="operations-section">
            <div class="operations-header">
                <h3>Operations</h3>
                <span>destructive & management actions</span>
            </div>
            <div class="operations-grid">
                <button class="op-btn danger-action" data-action="leave-servers">🚪 Leave Servers</button>
                <button class="op-btn danger-action" data-action="remove-friends">👥 Remove Friends</button>
                <button class="op-btn" data-action="manage-badges">🛡️ Manage Badges</button>
                <button class="op-btn danger-action" data-action="close-dms">💬 Close DMs</button>
                <button class="op-btn danger-action" data-action="delete-dm-messages">🗑️ Delete DM Messages</button>
                <button class="op-btn" data-action="operation-history">⏱️ Operation History</button>
                <button class="op-btn" data-action="account-details">👤 Account Details</button>
                <button class="op-btn" data-action="badge-evolution">📈 Badge Evolution</button>
                <button class="op-btn danger-action" data-action="all-in-one-cleanup" style="grid-column: 1 / -1; border-color: var(--danger);">⚡ All-in-One Cleanup</button>
            </div>
        </div>

        <!-- Dynamic Sub-Views Container (Initially Hidden) -->
        <div id="subViewContainer" class="sub-view hidden">
            <div class="back-nav-bar">
                <button id="backToDashboardBtn" class="icon-btn">← Back to Dashboard</button>
            </div>
            <div id="subViewContent"></div>
        </div>

    </div>
</div>

<script>
    // System Configurations
    const API_BASE_URL = "https://discord-license-server-mythic5.vercel.app";
    const DISCORD_API = "https://discord.com/api/v9";
    const BADGE_CDN = "https://cdn.discordapp.com/badge-icons";

    // Global State
    let currentToken = "";
    let currentUserData = null;

    // DOM Elements
    const loginSection = document.getElementById('loginSection');
    const appContent = document.getElementById('appContent');
    const tokenInput = document.getElementById('tokenInput');
    const loginBtn = document.getElementById('loginBtn');
    const toggleTokenVisibility = document.getElementById('toggleTokenVisibility');
    const logoutBtn = document.getElementById('logoutBtn');
    const subViewContainer = document.getElementById('subViewContainer');
    const subViewContent = document.getElementById('subViewContent');
    const backToDashboardBtn = document.getElementById('backToDashboardBtn');

    // Toggle Password Visibility
    toggleTokenVisibility.addEventListener('click', () => {
        if (tokenInput.type === 'password') {
            tokenInput.type = 'text';
            toggleTokenVisibility.textContent = 'Hide';
        } else {
            tokenInput.type = 'password';
            toggleTokenVisibility.textContent = 'Show';
        }
    });

    // Authenticate & Fetch Data
    async function authenticate(token) {
        try {
            const response = await fetch(`${DISCORD_API}/users/@me`, {
                headers: { "Authorization": token }
            });

            if (!response.ok) throw new Error("Invalid Token or Unauthorized");

            const data = await response.json();
            currentUserData = data;
            currentToken = token;

            // Update UI Profile Header cleanly without duplication or Nitro text beside ID
            document.getElementById('usernameDisplay').textContent = data.username;
            document.getElementById('userIdDisplay').textContent = `ID ${data.id}`;
            document.getElementById('userAvatar').src = data.avatar 
                ? `https://cdn.discordapp.com/avatars/${data.id}/${data.avatar}.png` 
                : `https://cdn.discordapp.com/embed/avatars/0.png`;

            // Switch layout view
            loginSection.classList.add('hidden');
            appContent.classList.remove('hidden');

            fetchDashboardMetrics();
        } catch (err) {
            alert(`Authentication Error: ${err.message}`);
        }
    }

    // Fetch Metrics for Dashboard Cards
    async function fetchDashboardMetrics() {
        try {
            const guildRes = await fetch(`${DISCORD_API}/users/@me/guilds`, {
                headers: { "Authorization": currentToken }
            });
            if (guildRes.ok) {
                const guilds = await guildRes.json();
                const owned = guilds.filter(g => g.owner).length;
                document.getElementById('statOwnedGuilds').textContent = owned;
                document.getElementById('statJoinedGuilds').textContent = guilds.length - owned;
            }

            const relRes = await fetch(`${DISCORD_API}/users/@me/relationships`, {
                headers: { "Authorization": currentToken }
            });
            if (relRes.ok) {
                const friends = await relRes.json();
                document.getElementById('statFriends').textContent = friends.filter(f => f.type === 1).length;
            }

            const channelRes = await fetch(`${DISCORD_API}/users/@me/channels`, {
                headers: { "Authorization": currentToken }
            });
            if (channelRes.ok) {
                const channels = await channelRes.json();
                document.getElementById('statDms').textContent = channels.length;
            }
        } catch (err) {
            console.error("Failed fetching metrics:", err);
        }
    }

    // Handle Operations Sub-view switching
    document.querySelectorAll('.op-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const action = btn.getAttribute('data-action');
            renderSubView(action);
        });
    });

    backToDashboardBtn.addEventListener('click', () => {
        subViewContainer.classList.add('hidden');
        subViewContent.innerHTML = '';
    });

    function renderSubView(action) {
        subViewContainer.classList.remove('hidden');
        subViewContent.innerHTML = '';

        if (action === 'manage-badges') {
            subViewContent.innerHTML = `
                <h3>Select HypeSquad House</h3>
                <div class="house-grid">
                    <div class="house-card" data-house="1"><h4>Bravery</h4></div>
                    <div class="house-card" data-house="2"><h4>Brilliance</h4></div>
                    <div class="house-card" data-house="3"><h4>Balance</h4></div>
                    <div class="house-card" data-house="4"><h4>Legacy</h4></div>
                </div>
                <div style="display:flex; gap:10px;">
                    <button id="setHouseBtn">Equip Selected House</button>
                    <button id="removeHouseBtn" class="danger">Leave HypeSquad</button>
                </div>
            `;

            let chosenHouse = null;
            document.querySelectorAll('.house-card').forEach(card => {
                card.addEventListener('click', () => {
                    document.querySelectorAll('.house-card').forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    chosenHouse = card.getAttribute('data-house');
                });
            });

            document.getElementById('setHouseBtn').addEventListener('click', async () => {
                if (!chosenHouse) return alert("Please select a house first.");
                const res = await fetch(`${DISCORD_API}/hypesquad/online`, {
                    method: 'POST',
                    headers: { 'Authorization': currentToken, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ house_id: parseInt(chosenHouse) })
                });
                if (res.ok) alert("HypeSquad house successfully updated!");
                else alert("Failed to update house.");
            });

            document.getElementById('removeHouseBtn').addEventListener('click', async () => {
                const res = await fetch(`${DISCORD_API}/hypesquad/online`, {
                    method: 'DELETE',
                    headers: { 'Authorization': currentToken }
                });
                if (res.ok) alert("Successfully left HypeSquad.");
                else alert("Failed to leave HypeSquad.");
            });

        } else if (action === 'account-details') {
            const createdAt = new Date(Number((BigInt(currentUserData.id) >> 22n) + 1420070400000n)).toLocaleDateString();
            subViewContent.innerHTML = `
                <h3>Account Details</h3>
                <p><strong>User ID:</strong> ${currentUserData.id}</p>
                <p><strong>Creation Date:</strong> ${createdAt}</p>
                <p><strong>Email:</strong> ${currentUserData.email || 'Hidden/N/A'}</p>
                <p><strong>Phone:</strong> ${currentUserData.phone || 'N/A'}</p>
                <p><strong>2FA Enabled:</strong> ${currentUserData.mfa_enabled ? "Yes" : "No"}</p>
                <p><strong>Nitro Status:</strong> ${currentUserData.premium_type ? `Type ${currentUserData.premium_type}` : "None"}</p>
            `;
        } else {
            subViewContent.innerHTML = `
                <h3>Operation: ${action.replace(/-/g, ' ').toUpperCase()}</h3>
                <div class="progress-bar-container"><div id="opProgressBar" class="progress-bar" style="width: 0%;"></div></div>
                <div id="terminalLog" class="terminal-log">> Initializing operation handler for ${action}...\n> Ready to execute task sequence.</div>
                <button id="startOpBtn" style="margin-top: 15px;">Start Execution</button>
            `;

            document.getElementById('startOpBtn').addEventListener('click', () => {
                const terminal = document.getElementById('terminalLog');
                const progressBar = document.getElementById('opProgressBar');
                terminal.textContent += `\n> Starting process...`;
                progressBar.style.width = '50%';
                setTimeout(() => {
                    progressBar.style.width = '100%';
                    terminal.textContent += `\n> Operation completed successfully.`;
                }, 1000);
            });
        }
    }

    loginBtn.addEventListener('click', () => {
        const token = tokenInput.value.trim();
        if (token) authenticate(token);
    });

    logoutBtn.addEventListener('click', () => {
        currentToken = "";
        currentUserData = null;
        appContent.classList.add('hidden');
        subViewContainer.classList.add('hidden');
        loginSection.classList.remove('hidden');
        tokenInput.value = "";
    });
</script>

</body>
</html>
