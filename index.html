<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Discord Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">

    <section id="licenseScreen" class="screen">
      <div class="card license-card">
        <div class="card-glow"></div>
        <div class="brand">
          <span class="brand-dot"></span>
          <h1>Discord Manager</h1>
        </div>
        <p class="subtitle">Activate your license key or start a limited trial.</p>
        <div class="field">
          <label for="licenseKeyInput" class="field-label">License Key</label>
          <div class="field-control">
            <input id="licenseKeyInput" type="text" autocomplete="off" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX">
            <button id="licensePasteBtn" class="field-btn" type="button" title="Paste key" aria-label="Paste license key">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 12h6M9 16h4"/></svg>
            </button>
          </div>
        </div>
        <button id="licenseActivateBtn" class="btn btn-primary" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l8 4v6c0 5.25-3.375 8.625-8 10-4.625-1.375-8-4.75-8-10V6z"/><path d="M9 12l2 2 4-4"/></svg>
          <span>Activate</span>
        </button>
        <button id="licenseTrialBtn" class="btn btn-secondary" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5"/><path d="M9 2h6"/></svg>
          <span>Start 10-Minute Trial</span>
        </button>
        <a id="licenseBuyBtn" class="btn btn-outline" href="https://t.me/" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39A2 2 0 0 0 9.66 16H20a2 2 0 0 0 2-1.9l1-8.1H6"/></svg>
          <span>Buy a Code</span>
        </a>
        <p id="licenseMsg" class="msg" role="alert" aria-live="polite"></p>
      </div>
    </section>

    <section id="appScreen" class="screen">
      <header class="app-header">
        <div class="app-brand">
          <span class="brand-dot small"></span>
          <span class="app-brand-name">Discord Manager</span>
        </div>
        <span id="sessionPlan" class="badge"></span>
        <span id="trialCountdown" class="countdown"></span>
        <span class="spacer"></span>
        <button id="lockBtn" class="btn btn-ghost btn-small" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <span>Lock</span>
        </button>
      </header>
      <main class="app-main">
        <div class="glass-panel placeholder">
          <div class="panel-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          </div>
          <h2>Dashboard</h2>
          <p>Your manager session is active. This is the Phase 1 shell.</p>
        </div>
      </main>
    </section>

    <div id="renewalModal" class="modal">
      <div class="modal-card">
        <div class="modal-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15.36-6.36L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.36 6.36L3 16"/><path d="M3 21v-5h5"/></svg>
        </div>
        <h2>License Needs Renewal</h2>
        <p id="renewalMsg"></p>
        <p id="renewalGrace"></p>
        <button id="renewalCheckBtn" class="btn btn-primary" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15.36-6.36L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.36 6.36L3 16"/><path d="M3 21v-5h5"/></svg>
          <span>Check Again</span>
        </button>
      </div>
    </div>

  </div>

  <div id="toastContainer" class="toast-container" aria-live="assertive"></div>

  <script src="js/manager.js"></script>
  <script src="js/license.js"></script>
</body>
</html>
