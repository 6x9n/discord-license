<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Discord Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">

    <section id="appScreen" class="screen active">
      <header class="app-header">
        <div class="app-brand">
          <span class="brand-dot small"></span>
          <span class="app-brand-name">Discord Manager</span>
        </div>
        <span id="sessionPlan" class="badge">Open Access</span>
        <span class="spacer"></span>
      </header>
      <main class="app-main">
        <div class="glass-panel placeholder">
          <div class="panel-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          </div>
          <h2>Dashboard</h2>
          <p>Manager is fully unlocked. Open access is enabled for all visitors.</p>
        </div>
      </main>
    </section>

  </div>

  <div id="toastContainer" class="toast-container" aria-live="assertive"></div>

  <script src="js/manager.js"></script>
  <script src="js/license.js"></script>
</body>
</html>
